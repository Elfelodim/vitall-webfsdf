<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesor Jurídico Premium | Vitall</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos Phosphor (Librería de iconos) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- jsPDF para generación de documentos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body class="premium-mode">
    
    <div class="chatbot-wrapper">
        <!-- Encabezado -->
        <div class="chat-header">
            <div class="header-icon glow-effect">
                <i class="ph-fill ph-crown"></i>
            </div>
            <div class="header-info">
                <h1 class="shimmer-text">Asesor Jurídico AI (Premium)</h1>
                <p><span class="status-dot"></span> Conectado a la IA</p>
            </div>
            
            <button id="configBtn" class="config-btn" title="Configurar API Key">
                <i class="ph-fill ph-gear"></i>
            </button>
        </div>

        <!-- Área de mensajes -->
        <div class="chat-messages" id="chatMessages">
            <!-- Los mensajes se insertarán aquí dinámicamente -->
        </div>

        <!-- Área de entrada -->
        <form class="chat-input-form" id="chatForm">
            <textarea id="chatInput" rows="1" placeholder="Describe tu caso jurídico aquí..." disabled></textarea>
            <button type="submit" id="sendBtn" class="send-btn" disabled>
                <i class="ph-fill ph-paper-plane-right"></i>
            </button>
        </form>
    </div>

    <!-- Modal de Configuración (API Key) -->
    <div id="apiModal" class="modal-overlay hidden">
        <div class="modal-content animate-slide-up">
            <div class="modal-header">
                <h3>Configuración de Seguridad</h3>
                <button id="closeModalBtn"><i class="ph-bold ph-x"></i></button>
            </div>
            <p>Para usar la Inteligencia Artificial, ingresa tu API Key de Google Gemini. Esta clave se guardará únicamente en tu navegador de forma segura.</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
            <button id="saveApiBtn" class="save-btn">Guardar y Activar IA</button>
        </div>
    </div>

    <!-- Importmap para Gemini SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <script src="chatbot.js?v=12"></script>
</body>
</html>
